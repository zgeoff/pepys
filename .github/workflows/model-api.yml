# The model-api lane spends the model API, so it runs nightly, on dispatch,
# and on a pull request that bumps the Agent SDK, never on every pull request.
name: model-api

on:
  pull_request:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # the Agent SDK gate: it runs only on a pull request, and finds whether the
  # pull request changes the SDK releases that bun.lock holds
  agent-sdk-bump:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bumped: ${{ steps.compare.outputs.bumped }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # the script imports nothing, so the job skips the install
      - name: Compare the Agent SDK releases
        id: compare
        run: bun run --silent ci:agent-sdk-bump

  # A schedule or dispatch run skips the gate, so its output is empty and the
  # lane runs. != 'false', so a failed gate still runs the lane.
  model-api:
    needs: [agent-sdk-bump]
    if: ${{ !cancelled() && needs.agent-sdk-bump.outputs.bumped != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the channel and components from rust-toolchain.toml
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install cargo-nextest
        uses: taiki-e/install-action@c509219cf42fba86913069efd0ade2458c59337b # v2.90.1
        with:
          tool: cargo-nextest@0.9.148
      - name: Model API tests
        run: cargo nextest run --workspace --locked --profile model-api --no-tests=pass
