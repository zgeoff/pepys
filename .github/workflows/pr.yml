# repo-sync owns only the zgeoff/tools pins in this file, and keeps the jobs
# written here, such as rust and e2e.
name: PR

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # bun-checks fails before running anything when a listed script is missing,
  # so a renamed script cannot drop a check without notice.
  ci:
    permissions:
      contents: read
      pull-requests: write
    uses: zgeoff/tools/.github/workflows/bun-checks.yml@290fa478c0e159be6c4da242cdd40ac1d511c785 # main
    with:
      scripts: audit deadcode format:check lint:full lint:toml check schema:check test typecheck

  # the path gate for the Rust job: a pull request that touches no Rust input
  # skips it, and every push to main runs it
  changes:
    permissions:
      contents: read
    uses: zgeoff/tools/.github/workflows/paths-changed.yml@290fa478c0e159be6c4da242cdd40ac1d511c785 # main
    with:
      paths: |
        crates/**
        packages/ingest/src/fact-log/fixtures/**
        packages/ingest/src/blob-store/fixtures/**
        packages/source-github/src/generated/github-pull-request.sql
        packages/schema/src/fact-envelope-cases.json
        Cargo.toml
        Cargo.lock
        rust-toolchain.toml
        rustfmt.toml
        deny.toml
        .config/nextest.toml
        .github/workflows/pr.yml

  rust:
    needs: [changes]
    if: ${{ !cancelled() && needs.changes.outputs.changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustup reads the channel and components from rust-toolchain.toml
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Install the cargo tools
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest@0.9.148,cargo-deny@0.20.2,cargo-shear@1.14.0
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Unused dependencies
        run: cargo shear
      - name: Advisories, licenses and sources
        run: cargo deny --locked check
      # nextest skips doctests, so they run on their own after it
      - name: Tests
        run: cargo nextest run --workspace --locked --profile ci --no-tests=pass
      - name: Doctests
        run: cargo test --workspace --doc --locked

  # bun-checks installs no Rust, zig or wasm-tools, so the e2e lane runs here,
  # with the host and the consumers built in steps of their own, outside the
  # lane's per-test limit. Any change can break the GitHub pull request
  # path, so it has no path gate.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rustup reads the channel and components from rust-toolchain.toml
      - name: Install the pinned toolchain
        run: rustup toolchain install
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Install
        run: bun install --frozen-lockfile
      - name: Install zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.16.0
      - name: Install wasm-tools and nextest
        uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: wasm-tools@1.262.0,cargo-nextest@0.9.148
      - name: Export the zig and wasm-tools paths
        run: bun run --silent ci:tool-paths
      - name: Build the host
        run: cargo build --bin pepys --locked
      - name: Build the consumers
        run: bun run consumers:build
      - name: End-to-end tests
        run: bun run test:e2e
      # the Rust lane starts a stack of its own, so the Bun lane's stack is gone by then
      - name: Rust end-to-end tests
        run: bun run test:e2e:rust

  # the one status the main ruleset requires: it runs even when a job it needs
  # failed, and passes only when every one of them succeeded or was skipped by
  # its path gate
  checks:
    needs: [ci, changes, rust, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # the script imports nothing, so the job skips the install
      - name: Require every check
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bun run --silent ci:require-checks
