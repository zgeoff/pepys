[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

# The catalog: every crate version lives here once, as an exact `=x.y.z` pin,
# and a crate depends on it with `workspace = true`.
[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
pepys-schema = { path = "crates/schema", version = "=0.0.0" }
s2-sdk = "=0.35.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tokio = { version = "=1.53.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
turso = "=0.8.3"
wasmtime = "=49.0.3"
wasmtime-wasi = "=49.0.3"

[workspace.lints.clippy]
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
