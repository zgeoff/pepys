[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

# The catalog: every crate version lives here once, as an exact `=x.y.z` pin,
# and a crate depends on it with `workspace = true`.
[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
pepys-schema = { path = "crates/schema", version = "=0.0.0" }
s2-sdk = "=0.35.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
# turso's default fts feature and wasmtime's default cache feature pull in zstd 0.13, which carries
# RUSTSEC-2026-0391, RUSTSEC-2026-0398 and RUSTSEC-2026-0403. The host uses neither feature, so
# both crates list their other default features instead.
turso = { version = "=0.8.3", default-features = false, features = ["mimalloc"] }
wasmtime.version = "=50.0.0"
wasmtime.default-features = false
wasmtime.features = [
  "addr2line",
  "anyhow",
  "async",
  "backtrace",
  "compile-time-builtins",
  "component-model",
  "component-model-async",
  "coredump",
  "cranelift",
  "debug",
  "debug-builtins",
  "demangle",
  "gc",
  "gc-copying",
  "gc-drc",
  "gc-null",
  "parallel-compilation",
  "pooling-allocator",
  "profiling",
  "runtime",
  "stack-switching",
  "std",
  "threads",
  "wat",
  "wit-parser",
]
wasmtime-wasi = "=49.0.5"

[workspace.lints.clippy]
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"
