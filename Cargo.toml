[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

# The catalog: every crate version lives here once, as an exact `=x.y.z` pin,
# and a crate depends on it with `workspace = true`.
[workspace.dependencies]
clap = { version = "=4.6.7", features = ["derive", "env"] }
http-body-util = "=0.1.5"
hyper = "=1.12.0"
hyper-util = { version = "=0.1.21", features = ["client-legacy", "http1", "tokio"] }
prost = "=0.14.4"
# The S3 signing alone: the Garage adapter sends each request through hyper-util.
rusty-s3 = { version = "=0.11.0", default-features = false, features = ["rustcrypto"] }
s2-api = "=0.44.1"
s2-sdk = "=0.44.1"
serde = { version = "=1.0.229", features = ["derive"] }
# float_roundtrip parses each number to the nearest double, as JavaScript's JSON.parse does. The
# default parse is faster and can land one double off, which gives a row a key that TypeScript
# readers do not give it.
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.11.1"
tempfile = "=3.27.0"
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-service = "=0.3.3"
turmoil = "=0.7.2"
# turso's default fts feature and wasmtime's default cache feature pull in zstd 0.13, which carries
# RUSTSEC-2026-0391, RUSTSEC-2026-0398 and RUSTSEC-2026-0403. The host uses neither feature, so
# both crates list their other default features instead.
turso = { version = "=0.8.3", default-features = false, features = ["mimalloc"] }
url = "=2.5.8"
wasmtime.version = "=50.0.1"
wasmtime.default-features = false
wasmtime.features = [
  "addr2line",
  "anyhow",
  "async",
  "backtrace",
  "compile-time-builtins",
  "component-model",
  "component-model-async",
  "coredump",
  "cranelift",
  "debug",
  "debug-builtins",
  "demangle",
  "gc",
  "gc-copying",
  "gc-drc",
  "gc-null",
  "parallel-compilation",
  "pooling-allocator",
  "profiling",
  "runtime",
  "stack-switching",
  "std",
  "threads",
  "wat",
  "wit-parser",
]
wasmtime-wasi = "=50.0.1"

[workspace.lints.clippy]
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

# A debug host compiles each consumer module with an unoptimised Cranelift, which took the e2e
# deployment's `up` from 2.5 s to 7 s before its first swap.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3
