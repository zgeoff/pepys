# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages (@zgeoff, @impz, @wringer) skip the gate for good, with no removal
# comment; their third-party dependencies stay behind it. Renovate bumps them as
# soon as they publish, so each one pepys installs, directly or through another
# first-party package, needs an entry here, or bun install refuses the bump.
minimumReleaseAgeExcludes = [
  "@wringer/core",
  "@wringer/db",
  "@wringer/gunshi",
  "@wringer/http",
  "@wringer/mcp",
  "@wringer/stream",
  "@zgeoff/agent-hooks",
  "@zgeoff/bun-test-extended",
  "@zgeoff/chex",
  "@zgeoff/commitlint-config",
  "@zgeoff/diet",
  "@zgeoff/format-codemod",
  "@zgeoff/kysely-bun-sqlite",
  "@zgeoff/mcp-auth",
  "@zgeoff/oxlint-config",
  "@zgeoff/rig",
  "@zgeoff/std",
  "@zgeoff/testing",
  "@impz/client",
  "@impz/testing",
]

[test]
# registers jest-extended matchers for `bun test`, the kit's env restore, the mock network that
# answers every remote API a test reaches, and the default GitHub API handlers
preload = [
  "@zgeoff/bun-test-extended",
  "@zgeoff/testing/preload",
  "./packages/mock-network/src/mock-network.ts",
  "./packages/source-github/src/test-utils/use-github-api-handlers.ts",
]
# spikes test themselves, and the e2e tests need the stack that `test:e2e` starts; rig's unit run
# passes ignore patterns of its own, which replace this list, so its config lists the spikes too
pathIgnorePatterns = ["research/**", "**/e2e/**"]
