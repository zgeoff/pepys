# pnpm-style symlinked node_modules — no phantom dependencies
[install]
linker = "isolated"

# bun add saves exact versions, no ^/~ ranges
exact = true

# supply-chain guard: only install versions published >= 7 days ago
minimumReleaseAge = 604800

# first-party packages skip the gate; their third-party dependencies stay
# behind it. Renovate bumps @zgeoff packages as soon as they publish, so each
# one pepys installs, directly or through another first-party package, needs an
# entry here, or bun install refuses the bump.
# fast-uri 3.1.9 (published 2026-10-19, patches GHSA-w74x-v6f9-j3xg + GHSA-xhq7-xmqj-769h + GHSA-wjr9-j795-jxcr + GHSA-333x-w4r6-6crp) ages past the gate ~2026-10-26 — remove then (audit-fix)
minimumReleaseAgeExcludes = [
  "@zgeoff/bun-test-extended",
  "@zgeoff/checks",
  "@zgeoff/commitlint-config",
  "@zgeoff/format-codemod",
  "@zgeoff/oxlint-config",
  "@zgeoff/skill-gate",
  "fast-uri",
]

[test]
# registers jest-extended matchers for `bun test`
preload = ["@zgeoff/bun-test-extended"]
