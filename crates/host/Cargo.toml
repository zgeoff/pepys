[package]
name = "pepys-host"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pepys"
path = "src/main.rs"

[dependencies]
clap.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
pepys-schema.workspace = true
rusty-s3.workspace = true
s2-sdk.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
turso.workspace = true
url.workspace = true
wasmtime.workspace = true
wasmtime-wasi.workspace = true

[dev-dependencies]
hyper = { workspace = true, features = ["http2", "server"] }
hyper-util = { workspace = true, features = ["http2"] }
prost.workspace = true
s2-api.workspace = true
# The hidden feature lets a test hand the client the simulated network's connector.
s2-sdk = { workspace = true, features = ["_hidden"] }
tempfile.workspace = true
tower-service.workspace = true
turmoil.workspace = true

[lints]
workspace = true
