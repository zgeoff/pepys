[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# turso pulls in chrono, and every turso release up to 0.9.0-pre.5 still does. Drop this entry once
# a turso release without chrono is in Cargo.lock.
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained, with no fix; it comes in only through turso" },
]

[licenses]
version = 2
allow = [
  "Apache-2.0",
  # wasmtime and its cranelift and wasm-tools crates carry the LLVM exception
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9
# the list covers licenses crates are expected to bring, before any crate uses them
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-git = "deny"
unknown-registry = "deny"
