# Git hooks. pre-commit fixes staged files only (fast); pre-push runs the
# repo's own jobs, then the chex baseline, which checks what the branch
# changes, plus the cheap whole-tree gates. CI runs every whole-tree check:
# type-aware lint (lint:full), dead code, and the full test suite.

extends:
  - node_modules/@zgeoff/chex/lefthook.yml

pre-commit:
  piped: true
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: oxlint --fix
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx}'
      run: node_modules/.bin/oxlint --fix --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    - name: oxfmt
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,md,css,yml,yaml,html}'
      run: node_modules/.bin/oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
    # the exclude mirrors .formatignore: the tool exits 2 when every file
    # it is given is ignored, so ignored files must not reach it
    - name: format-codemod
      glob: '*.{ts,tsx}'
      exclude:
        - '**/dist/**'
        - 'dist/**'
        - '**/coverage/**'
        - 'coverage/**'
        - '.worktrees/**'
        - '.claude/**'
      run: node_modules/.bin/format-codemod --quiet {staged_files}
      stage_fixed: true
    # a check, not a fixer: rustfmt also rewrites the modules a file declares,
    # which may hold unstaged work, so run `cargo fmt` to apply the fix
    - name: rustfmt
      glob: '*.rs'
      run: rustfmt --edition 2024 --check {staged_files}
    - name: tombi format
      glob: '*.toml'
      run: node_modules/.bin/tombi format {staged_files}
      stage_fixed: true
    # after the fixers, so it checks what they wrote; skipped when no staged
    # file matches the glob
    - name: typecheck
      glob: '*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc}'
      run: bun run typecheck
    # last so it scans what the fixers above re-staged; needs the gitleaks
    # binary on PATH (mise: `mise use -g gitleaks`)
    - name: gitleaks
      run: gitleaks git --pre-commit --staged --redact --no-banner

commit-msg:
  jobs:
    - name: commitlint
      run: node_modules/.bin/commitlint --edit {1}

pre-push:
  # Sequential, to bound memory on a small host.
  piped: true
  # The test job below runs in place of the baseline's chex-test, because
  # test:related sweeps the leftovers of killed test runs before rig related.
  exclude_tags:
    - chex-test
  jobs:
    - name: chex-baseline
      files: echo package.json
      run: |
        if [ ! -f node_modules/@zgeoff/chex/lefthook.yml ]; then
          echo "chex-baseline: node_modules/@zgeoff/chex/lefthook.yml is missing, so lefthook runs none of the chex baseline's jobs; run bun install, then try again"
          exit 1
        fi
        # {files}
    - name: lint:shell
      run: bun run lint:shell
    # the workspace is small, so clippy checks all of it when any Rust changed;
    # a TOML file outside Cargo's inputs, such as bunfig.toml, is not Rust
    - name: clippy
      glob:
        - '*.rs'
        - '*Cargo.toml'
        - 'Cargo.lock'
        - 'rust-toolchain.toml'
      run: cargo clippy --workspace --all-targets --quiet -- -D warnings
    - name: test
      files:
        unset $(git rev-parse --local-env-vars); bun
        node_modules/@zgeoff/chex/src/read-branch-files.ts
      glob: '*.{ts,tsx,toml}'
      run: bun x --no-install diet -- bun run test:related {files}
