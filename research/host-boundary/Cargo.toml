[package]
name = "pepys-host-boundary"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

# an empty workspace, so the root workspace does not claim the spike
[workspace]
[workspace.lints.clippy]
expect_used = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
wildcard_enum_match_arm = "warn"

[workspace.lints.rust]
unsafe_code = "forbid"

[dependencies]
serde_json = "=1.0.154"
thiserror = "=2.0.21"
wasmtime = "=49.0.3"
wasmtime-wasi = "=49.0.5"

[lints]
workspace = true
